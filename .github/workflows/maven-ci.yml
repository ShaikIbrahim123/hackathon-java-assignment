name: Maven Build and Test CI


on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"



jobs:

  build-test:


    runs-on: ubuntu-latest


    steps:


      # Checkout your repository code
      - name: Checkout source code
        uses: actions/checkout@v4



      # Install Java 17 required by Quarkus project
      - name: Setup Java 17
        uses: actions/setup-java@v4

        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven



      # Compile application and execute tests
      - name: Build and run tests
        run: ./mvnw clean verify