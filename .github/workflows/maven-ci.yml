name: Maven Build and Test CI


on:

  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"



jobs:

  build:

    name: Build and Run Tests

    runs-on: ubuntu-latest


    steps:

      # Step 1 - Download repository
      - name: Checkout repository
        uses: actions/checkout@v4



      # Step 2 - Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven



      # Step 3 - Give execute permission to Maven wrapper
      - name: Make mvnw executable
        run: chmod +x mvnw



      # Step 4 - Build application and execute tests
      - name: Build and Test
        run: ./mvnw clean verify